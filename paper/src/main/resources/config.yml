settings:
  debug-mode: false
  language-locale: en_us
  startup-banner: true
  web-directory:
    path: web
    read-only: false
  web-tile:
    image-format: png
    image-quality: 0.0
    buffer-size: 524288
  website:
    title: LiveMap v4
    logo: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="currentColor"><path d="M199.6 34.5 134.2.3h-.2c-.1-.2-.3-.2-.5-.2h-.4a2.6 2.6 0 0 0-.9.1h-.2L67.7 34 3.5.3a2.4 2.4 0 0 0-3.5 2v181c0 1 .5 1.7 1.3 2.1l65.2 34.2.5.2h.2a2.5 2.5 0 0 0 1.1 0h.2l.5-.2 64-33.6 64.3 33.7a2.5 2.5 0 0 0 2.3 0c.7-.5 1.2-1.3 1.2-2.1v-181a2 2 0 0 0-1.3-2zM196 213.7l-61.9-32.5h-.2l-.5-.2h-.4a2.6 2.6 0 0 0-.9.2h-.2L70 213.7V38l63-33 63 33z"/><path d="M135.5 16.6v157.2c0 1.3-1 2.4-2.4 2.4-1.3 0-2.4-1-2.4-2.4V16.6c0-1.3 1.1-2.4 2.4-2.4 1.3 0 2.4 1.1 2.4 2.4z"/></svg>
    attribution: LiveMap &copy; 2020-2026
  internal-webserver:
    enabled: true
    bind: 0.0.0.0
    port: 8080
    url: http://localhost:8080
  performance:
    render-threads: -1
world-settings:
  default:
    enabled: true
    order: 0
    name: <world>
    render:
      scan-chunks: true
      center: []
      zoom:
        default: 0
        max-out: 3
        max-in: 2
      visible-areas:
        - type: world-border
      renderers:
        - id: fancy
          type: fancy
          name: Fancy
          icon: overworld_fancy.png
          heightmap: fancy
          biome-blend: 2
          translucent-fluids: true
  world:
    enabled: true
    order: 0
    name: Overworld
    render:
      renderers:
        - id: basic
          type: basic
          icon: overworld_basic.png
          name: Basic
          heightmap: basic
          biome-blend: 0
          translucent-fluids: false
        - id: fancy
          type: fancy
          icon: overworld_fancy.png
          name: Fancy
          heightmap: fancy
          biome-blend: 2
          translucent-fluids: true
        - id: biomes
          type: biomes
          icon: overworld_biomes.png
          name: Biomes
          heightmap: fancy
          biome-blend: 0
          translucent-fluids: false
        - id: flowermap
          type: flowermap
          icon: flowermap.png
          name: Flowers
          heightmap: fancy
          biome-blend: 0
          translucent-fluids: false
        - id: inhabited
          type: inhabited
          icon: inhabited.png
          name: Inhabited
          heightmap: fancy
          biome-blend: 0
          translucent-fluids: false
  world_nether:
    order: 1
    display-name: The Nether
    render:
      renderers:
        - id: basic
          type: basic
          icon: nether_basic.png
          name: Basic
          heightmap: basic
          biome-blend: 0
          translucent-fluids: false
        - id: fancy
          type: fancy
          icon: nether_fancy.png
          name: Fancy
          heightmap: fancy
          biome-blend: 0
          translucent-fluids: false
        - id: biomes
          type: biomes
          icon: nether_biomes.png
          name: Biomes
          heightmap: fancy
          biome-blend: 0
          translucent-fluids: false
        - id: nether_roof
          type: nether_roof
          icon: nether_roof.png
          name: Roof
          heightmap: fancy
          biome-blend: 0
          translucent-fluids: false
  world_the_end:
    order: 2
    display-name: The End
    render:
      renderers:
        - id: basic
          type: basic
          icon: the_end_basic.png
          name: Basic
          heightmap: basic
          biome-blend: 0
          translucent-fluids: false
        - id: biomes
          type: biomes
          icon: the_end_biomes.png
          name: Biomes
          heightmap: fancy
          biome-blend: 0
          translucent-fluids: false
